[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SanjanaRout", email = "sanjanarout2003@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "beanie>=2.0.1",
    "eval-type-backport>=0.4.0",
    "fastapi[standard]>=0.128.8",
    "joblib>=1.5.3",
    "motor>=3.7.1",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.11.0",
    "python-jose[cryptography]>=3.5.0",
    "scikit-learn==1.6.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

